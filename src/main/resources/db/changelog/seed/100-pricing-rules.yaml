databaseChangeLog:

  # ---------------------------------------------------------------------------
  # Representative pricing rules.
  #
  # Tagged `seed` so environments that manage pricing elsewhere can skip it:
  #   ./gradlew bootRun --args='--spring.liquibase.contexts=!seed'
  #
  # VEHICLE_REGISTRATION on tenant-a deliberately changes price mid-2026, so the
  # effective-dating boundary is demonstrable with two curl calls: an event on
  # 2026-06-30 rates at 2.00 and one on 2026-07-01 rates at 2.50.
  # ---------------------------------------------------------------------------
  - changeSet:
      id: 100-01-seed-pricing-rules
      author: jptoro
      context: seed
      changes:
        - insert:
            tableName: pricing_rule
            columns:
              - column: { name: tenant_id, value: tenant-a }
              - column: { name: transaction_code, value: VEHICLE_REGISTRATION }
              - column: { name: unit_price, valueNumeric: 2.000000 }
              - column: { name: currency, value: USD }
              - column: { name: effective_from, valueDate: 2026-01-01T00:00:00Z }
              - column: { name: effective_to, valueDate: 2026-07-01T00:00:00Z }
              - column: { name: description, value: "Initial rate, H1 2026" }

        - insert:
            tableName: pricing_rule
            columns:
              - column: { name: tenant_id, value: tenant-a }
              - column: { name: transaction_code, value: VEHICLE_REGISTRATION }
              - column: { name: unit_price, valueNumeric: 2.500000 }
              - column: { name: currency, value: USD }
              # Starts exactly where the previous rule ends: [from, to) means no
              # gap and no overlap at the changeover instant.
              - column: { name: effective_from, valueDate: 2026-07-01T00:00:00Z }
              - column: { name: effective_to, valueDate: null }
              - column: { name: description, value: "Rate increase from H2 2026, open ended" }

        - insert:
            tableName: pricing_rule
            columns:
              - column: { name: tenant_id, value: tenant-a }
              - column: { name: transaction_code, value: TITLE_TRANSFER }
              - column: { name: unit_price, valueNumeric: 7.250000 }
              - column: { name: currency, value: USD }
              - column: { name: effective_from, valueDate: 2026-01-01T00:00:00Z }
              - column: { name: effective_to, valueDate: null }
              - column: { name: description, value: "Flat rate, open ended" }

        # Fractional unit price: exercises rounding rather than leaving it theoretical.
        - insert:
            tableName: pricing_rule
            columns:
              - column: { name: tenant_id, value: tenant-a }
              - column: { name: transaction_code, value: RECORD_LOOKUP }
              - column: { name: unit_price, valueNumeric: 0.003333 }
              - column: { name: currency, value: USD }
              - column: { name: effective_from, valueDate: 2026-01-01T00:00:00Z }
              - column: { name: effective_to, valueDate: null }
              - column: { name: description, value: "Sub-cent unit price, exercises rounding" }

        # Second tenant, same transaction code at a different price: any
        # cross-tenant leak shows up as a wrong amount, not just wrong rows.
        - insert:
            tableName: pricing_rule
            columns:
              - column: { name: tenant_id, value: tenant-b }
              - column: { name: transaction_code, value: VEHICLE_REGISTRATION }
              - column: { name: unit_price, valueNumeric: 3.750000 }
              - column: { name: currency, value: EUR }
              - column: { name: effective_from, valueDate: 2026-01-01T00:00:00Z }
              - column: { name: effective_to, valueDate: null }
              - column: { name: description, value: "Different tenant, different price and currency" }
      rollback:
        - delete:
            tableName: pricing_rule
            where: tenant_id IN ('tenant-a', 'tenant-b')
