databaseChangeLog:

  # ---------------------------------------------------------------------------
  # raw_event -- the evidence table.
  #
  # Immutable once written. Everything downstream is derived and recomputable;
  # this is not. A reviewer tracing an invoice amount ends up here.
  # ---------------------------------------------------------------------------
  - changeSet:
      id: 002-01-raw-event
      author: jptoro
      changes:
        - createTable:
            tableName: raw_event
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_raw_event } }
              - column: { name: tenant_id, type: TEXT, constraints: { nullable: false } }
              - column: { name: event_id, type: UUID, constraints: { nullable: false } }
              - column: { name: customer_id, type: TEXT, constraints: { nullable: false } }
              - column: { name: transaction_code, type: TEXT, constraints: { nullable: false } }
              # occurredAt drives the billing period AND the pricing rule lookup.
              - column: { name: occurred_at, type: TIMESTAMPTZ, constraints: { nullable: false } }
              # receivedAt drives late-arrival detection. Independent axis.
              - column: { name: received_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: quantity, type: "NUMERIC(19,6)", constraints: { nullable: false } }
              # The original payload, verbatim. Never rewritten.
              - column: { name: payload, type: JSONB, constraints: { nullable: false } }
              # Detects a re-delivery whose body differs from the first one.
              - column: { name: payload_hash, type: TEXT, constraints: { nullable: false } }

        # The anchor of idempotency. Ingestion inserts and catches the violation
        # rather than doing a read-then-write, which would race under concurrent
        # delivery of the same event.
        - addUniqueConstraint:
            tableName: raw_event
            columnNames: tenant_id, event_id
            constraintName: uq_raw_event_tenant_event

        - sql:
            sql: ALTER TABLE raw_event ADD CONSTRAINT ck_raw_event_quantity_positive CHECK (quantity > 0)
        - sql:
            sql: ALTER TABLE raw_event ADD CONSTRAINT ck_raw_event_tenant_not_blank CHECK (length(btrim(tenant_id)) > 0)

        # Reconciliation and invoicing both query by tenant + customer + period.
        - createIndex:
            tableName: raw_event
            indexName: ix_raw_event_tenant_customer_occurred
            columns:
              - column: { name: tenant_id }
              - column: { name: customer_id }
              - column: { name: occurred_at }
      rollback:
        - dropTable: { tableName: raw_event }

  # ---------------------------------------------------------------------------
  # rejected_event -- events that failed validation.
  #
  # Written in a REQUIRES_NEW transaction so the record survives the rollback of
  # the caller. Without that, a rejection would roll back with the very thing it
  # is evidence of. No uniqueness here: a repeated rejection is information.
  # ---------------------------------------------------------------------------
  - changeSet:
      id: 002-02-rejected-event
      author: jptoro
      changes:
        - createTable:
            tableName: rejected_event
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_rejected_event } }
              - column: { name: tenant_id, type: TEXT, constraints: { nullable: false } }
              # Nullable: the payload may be malformed enough to lack a usable id.
              - column: { name: event_id, type: UUID }
              - column: { name: customer_id, type: TEXT }
              - column: { name: transaction_code, type: TEXT }
              - column: { name: occurred_at, type: TIMESTAMPTZ }
              - column: { name: received_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
              - column: { name: rejection_reasons, type: JSONB, constraints: { nullable: false } }
              - column: { name: payload, type: JSONB, constraints: { nullable: false } }
        - createIndex:
            tableName: rejected_event
            indexName: ix_rejected_event_tenant_received
            columns:
              - column: { name: tenant_id }
              - column: { name: received_at }
      rollback:
        - dropTable: { tableName: rejected_event }

  # ---------------------------------------------------------------------------
  # event_conflict -- same eventId, different payload.
  #
  # This means a bug upstream. We cannot resolve it automatically: billing the
  # second delivery would double-bill, and dropping it silently would hide a real
  # problem. First delivery wins, the discrepancy is recorded, and reconciliation
  # surfaces it for a human.
  # ---------------------------------------------------------------------------
  - changeSet:
      id: 002-03-event-conflict
      author: jptoro
      changes:
        - createTable:
            tableName: event_conflict
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_event_conflict } }
              - column: { name: tenant_id, type: TEXT, constraints: { nullable: false } }
              - column: { name: raw_event_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: original_payload_hash, type: TEXT, constraints: { nullable: false } }
              - column: { name: conflicting_payload_hash, type: TEXT, constraints: { nullable: false } }
              - column: { name: conflicting_payload, type: JSONB, constraints: { nullable: false } }
              - column: { name: detected_at, type: TIMESTAMPTZ, defaultValueComputed: now(), constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: event_conflict
            baseColumnNames: raw_event_id
            referencedTableName: raw_event
            referencedColumnNames: id
            constraintName: fk_event_conflict_raw_event
        - createIndex:
            tableName: event_conflict
            indexName: ix_event_conflict_tenant
            columns:
              - column: { name: tenant_id }
      rollback:
        - dropTable: { tableName: event_conflict }
