# Multi-instance overlay.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --scale app=3
#
# Three application instances share one database and one outbox. Each runs its own
# worker, and they coordinate entirely through `FOR UPDATE SKIP LOCKED` -- no leader
# election, no distributed lock, no broker.
#
# The app's own port mapping is removed (a fixed host port cannot be shared by three
# containers) and nginx fronts them instead, so the test scripts still talk to :8080.

services:
  app:
    # Replaces the single-instance mapping: with --scale, a fixed host port collides.
    ports: !override []
    environment:
      # Inherited from the base compose file (200ms) -- not overridden here, so a
      # scaled run and a single-instance run differ in ONE variable: the instance count.
      # The instance identifier is the container hostname, which Compose makes unique
      # per replica. The application reads it and stamps it on every message it
      # claims, so the evidence shows WHICH instance did what -- not merely that the
      # work got done.
      INSTANCE_ID_SOURCE: hostname

  loadbalancer:
    image: nginx:1.27-alpine
    depends_on:
      - app
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
