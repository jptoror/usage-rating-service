# Round-robins across every `app` container Compose started.
#
# Docker's embedded DNS (127.0.0.11) resolves the service name to all replica
# addresses. The name is resolved per request through a variable rather than in an
# upstream block: open-source nginx only re-resolves upstream names in the commercial
# build, so an `upstream ... resolve` directive fails to start at all. Using a
# variable in proxy_pass forces resolution at request time, which is what makes
# scaling visible to nginx without restarting it.

server {
    listen 8080;

    # Docker's embedded DNS. The short validity keeps the replica list fresh.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The tenant header is this service's identity mechanism, so it must survive
        # the hop. Set explicitly rather than relied upon: it is easy to break and
        # the failure would look like a tenancy bug rather than a proxy one.
        proxy_set_header X-Tenant-Id     $http_x_tenant_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
